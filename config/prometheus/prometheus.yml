# Prometheus config for Symbio
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'symbio-monitor'

scrape_configs:
  - job_name: 'symbio'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: /metrics
    scrape_interval: 10s

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
