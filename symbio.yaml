app_name: Symbio
config_file: null
evolution:
  auto_review: true
  dataset_export_format: sharegpt
  feedback_enabled: true
  sop_extraction: true
  trajectory_capture: true
hitl:
  approval_timeout: 300
  enabled: true
  high_risk_auto_suspend: true
  notify_chat_id: ''
  notify_platform: ''
log_file: null
log_level: !!python/object/apply:symbio.config.settings.LogLevel
- INFO
memory:
  auto_summary_threshold: 50
  embedding_dim: 1536
  embedding_model: text-embedding-3-small
  lancedb_path: ./data/lancedb
  max_memories: 10000
  similarity_threshold: 0.7
  window_size: 20
model:
  anthropic_api_key: ''
  anthropic_base_url: https://api.anthropic.com
  local_model_enabled: false
  local_model_name: qwen2.5:14b
  local_model_url: http://localhost:11434
  model_high: claude-opus-4-20250514
  model_low: claude-3-5-haiku-20241022
  model_medium: claude-sonnet-4-20250514
  openai_api_key: ''
  openai_base_url: https://api.openai.com/v1
server:
  debug: false
  host: 0.0.0.0
  port: 9090
  ws_heartbeat_interval: 30
tool:
  file_max_size_mb: 10
  git_auto_commit: false
  shell_blocked_commands:
  - rm -rf /
  - mkfs
  - dd if=
  - ':(){ :|:& };:'
  shell_timeout: 60
version: 0.1.0
